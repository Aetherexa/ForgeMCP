sonar.sourceEncoding=UTF-8

sonar.sources=packages
sonar.tests=packages
sonar.test.inclusions=packages/**/*.test.ts
sonar.exclusions=packages/**/*.test.ts,packages/**/dist/**,packages/**/coverage/**,node_modules/**

sonar.javascript.lcov.reportPaths=packages/application/coverage/lcov.info,packages/mcp-server/coverage/lcov.info,packages/telemetry-otel/coverage/lcov.info
sonar.coverage.exclusions=packages/core/src/**,packages/**/index.ts,packages/mcp-server/src/options.ts,packages/**/tsdown.config.ts,packages/**/vitest.config.ts

sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
