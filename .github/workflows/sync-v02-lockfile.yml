name: Sync v0.2 lockfile

on:
  push:
    branches:
      - feat/v0.2-mcp-server-adapter
    paths:
      - package.json
      - "packages/**/package.json"
      - ".github/workflows/sync-v02-lockfile.yml"

permissions:
  contents: write

jobs:
  lockfile:
    name: Generate pnpm lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: feat/v0.2-mcp-server-adapter

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare pnpm
        run: corepack prepare pnpm@11.10.0 --activate

      - name: Update lockfile
        run: pnpm install --lockfile-only

      - name: Commit lockfile
        run: |
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Lockfile already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update lockfile for v0.2"
          git push origin HEAD:feat/v0.2-mcp-server-adapter
