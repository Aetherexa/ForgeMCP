name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "chore/**"
      - "test/**"
      - "ci/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare pnpm
        run: corepack prepare pnpm@11.10.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release metadata
        run: pnpm release:verify

      - name: Build
        run: pnpm build

      - name: Smoke test package entry points
        run: pnpm package:smoke

      - name: Pack publishable packages
        run: |
          mkdir -p release
          pnpm --dir packages/core pack --pack-destination ../../release
          pnpm --dir packages/application pack --pack-destination ../../release
          pnpm --dir packages/mcp-server pack --pack-destination ../../release
          pnpm --dir packages/telemetry-otel pack --pack-destination ../../release
          test "$(find release -maxdepth 1 -name '*.tgz' | wc -l)" -eq 4

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format

      - name: Test with coverage thresholds
        run: pnpm test:coverage

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.sha }}
          path: |
            packages/application/coverage/**
            packages/mcp-server/coverage/**
            packages/telemetry-otel/coverage/**
          if-no-files-found: warn
          retention-days: 14

  sonar:
    name: SonarQube Cloud
    needs: validate
    if: ${{ needs.validate.result == 'success' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}

    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download coverage reports
        uses: actions/download-artifact@v8
        with:
          name: coverage-${{ github.sha }}
          path: packages

      - name: SonarQube Cloud configuration status
        if: env.SONAR_TOKEN == '' || env.SONAR_PROJECT_KEY == '' || env.SONAR_ORGANIZATION == ''
        run: |
          echo "::warning::SonarQube Cloud scan skipped. Configure SONAR_TOKEN secret plus SONAR_PROJECT_KEY and SONAR_ORGANIZATION repository variables to enable it."

      - name: SonarQube Cloud scan and quality gate
        if: env.SONAR_TOKEN != '' && env.SONAR_PROJECT_KEY != '' && env.SONAR_ORGANIZATION != ''
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}

      - name: SonarQube failure diagnostics
        if: ${{ failure() && env.SONAR_TOKEN != '' && env.SONAR_PROJECT_KEY != '' && github.event_name == 'pull_request' }}
        env:
          SONAR_PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          echo "Quality Gate conditions:"
          curl --silent --fail --user "$SONAR_TOKEN:" --get             --data-urlencode "projectKey=$SONAR_PROJECT_KEY"             --data-urlencode "pullRequest=$SONAR_PULL_REQUEST"             "https://sonarcloud.io/api/qualitygates/project_status" | jq .
          echo "Open Sonar issues:"
          curl --silent --fail --user "$SONAR_TOKEN:" --get             --data-urlencode "componentKeys=$SONAR_PROJECT_KEY"             --data-urlencode "pullRequest=$SONAR_PULL_REQUEST"             --data-urlencode "resolved=false"             --data-urlencode "ps=100"             "https://sonarcloud.io/api/issues/search"             | jq '{total, issues: [.issues[] | {rule, severity, type, message, component, line}]}'
