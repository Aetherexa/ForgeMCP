name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate and publish GitHub release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare pnpm
        run: corepack prepare pnpm@11.10.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag and package versions
        run: pnpm release:verify

      - name: Build
        run: pnpm build

      - name: Smoke test package entry points
        run: pnpm package:smoke

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format

      - name: Test with coverage thresholds
        run: pnpm test:coverage

      - name: Pack publishable packages
        run: |
          mkdir -p release
          pnpm --dir packages/core pack --pack-destination ../../release
          pnpm --dir packages/application pack --pack-destination ../../release
          pnpm --dir packages/mcp-server pack --pack-destination ../../release
          ls -la release

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/*.tgz --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/*.tgz               --verify-tag               --generate-notes               --title "$GITHUB_REF_NAME"
          fi
