name: Format Preview Module Planner

on:
  push:
    branches:
      - "feat/v0.3-sprint4-module-planner"

permissions:
  contents: read

jobs:
  preview:
    name: Prettier module planner diff
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Enable Corepack
        run: corepack enable
      - name: Prepare pnpm
        run: corepack prepare pnpm@11.10.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate canonical formatting diff
        run: |
          pnpm --filter @forgemcp/application exec prettier --write \
            src/registry/module-composition-planner.test.ts
          git diff -- \
            packages/application/src/registry/module-composition-planner.test.ts
