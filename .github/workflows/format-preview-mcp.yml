name: Format Preview MCP

on:
  push:
    branches:
      - "test/v0.3-sprint3-mcp-service-lifetimes"

permissions:
  contents: read

jobs:
  preview:
    name: Prettier canonical MCP diff
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare pnpm
        run: corepack prepare pnpm@11.10.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate canonical formatting diff
        run: |
          pnpm --filter @forgemcp/mcp-server exec prettier --write \
            src/create-forge-mcp-server.service-scope.test.ts
          git diff -- \
            packages/mcp-server/src/create-forge-mcp-server.service-scope.test.ts
