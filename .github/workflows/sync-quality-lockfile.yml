name: Sync quality lockfile

on:
  push:
    branches:
      - chore/public-repo-quality-gates
    paths:
      - package.json
      - "packages/**/package.json"
      - ".github/workflows/sync-quality-lockfile.yml"

permissions:
  contents: write

jobs:
  lockfile:
    name: Update pnpm lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: chore/public-repo-quality-gates

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare pnpm
        run: corepack prepare pnpm@11.10.0 --activate

      - name: Update lockfile
        run: pnpm install --lockfile-only

      - name: Commit lockfile
        run: |
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Lockfile already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update lockfile for quality tooling"
          git push origin HEAD:chore/public-repo-quality-gates
