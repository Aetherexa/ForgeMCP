name: Format preview

on:
  push:
    branches:
      - "feat/v0.4-sprint1-diagnostic-events"

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: corepack enable
      - run: corepack prepare pnpm@11.10.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @forgemcp/application exec prettier --write src/runtime/forge-application.diagnostics.test.ts
      - run: git diff -- packages/application/src/runtime/forge-application.diagnostics.test.ts
