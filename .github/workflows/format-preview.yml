name: Format preview

on:
  push:
    branches:
      - "test/v0.4-sprint1-mcp-diagnostic-correlation"

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: corepack enable
      - run: corepack prepare pnpm@11.10.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @forgemcp/mcp-server exec prettier --write src/create-forge-mcp-server.diagnostics.test.ts
      - run: git diff -- packages/mcp-server/src/create-forge-mcp-server.diagnostics.test.ts
