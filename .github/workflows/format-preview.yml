name: Format Preview

on:
  push:
    branches:
      - "feat/v0.3-sprint3-lifetime-resolution"

permissions:
  contents: read

jobs:
  preview:
    name: Prettier canonical diff
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare pnpm
        run: corepack prepare pnpm@11.10.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate canonical formatting diff
        run: |
          pnpm --filter @forgemcp/application exec prettier --write \
            src/service/service-registration.ts \
            src/service/service-registry.ts \
            src/service/service-registry.test.ts
          git diff -- \
            packages/application/src/service/service-registration.ts \
            packages/application/src/service/service-registry.ts \
            packages/application/src/service/service-registry.test.ts
